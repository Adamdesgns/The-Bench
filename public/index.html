<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>THE BENCH — Bench OS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
  :root{
    --ink:#111111; --card:#1A1916; --surface-2:#201E1A; --edge:#26241F;
    --gold:#D4AF37; --gold-dim:#9A7E28; --pale:#F5ECCB; --bone:#E8E4DA;
    --slate:#8F8A7A; --loss:#E5484D;
    --line:rgba(245,236,203,.07); --line-2:rgba(245,236,203,.13);
    --display:'EB Garamond',Georgia,serif; --ui:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{ font-family:var(--ui); color:var(--bone); background:var(--ink); overflow:hidden;
    background-image:
      radial-gradient(120% 80% at 80% 0%, rgba(212,175,55,.07), transparent 55%),
      radial-gradient(90% 60% at 0% 100%, rgba(212,175,55,.05), transparent 55%),
      repeating-linear-gradient(122deg, rgba(245,236,203,.010) 0 2px, transparent 2px 11px);
    font-size:13px; }
  .mono{font-family:var(--mono)}

  /* ── menu bar ─────────────────────── */
  .menubar{ position:fixed; top:0; left:0; right:0; height:30px; z-index:9000; display:flex; align-items:center; gap:16px;
    padding:0 14px; background:rgba(14,13,11,.82); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
  .menubar .seal{ width:18px;height:18px;border-radius:50%;border:1.5px solid var(--gold); display:grid;place-items:center;
    font:700 10px var(--display); color:var(--gold); transform:rotate(-8deg); }
  .menubar .app{ font-weight:700; letter-spacing:.06em; color:var(--pale); font-size:13px; }
  .menubar .m{ color:var(--slate); font-size:12.5px; cursor:default; }
  .menubar .m:hover{ color:var(--bone); }
  .menubar .right{ margin-left:auto; display:flex; align-items:center; gap:14px; }
  .menubar .di{ display:flex; align-items:center; gap:6px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--slate); }
  .menubar .di i{ width:7px;height:7px;border-radius:50%; background:var(--gold); box-shadow:0 0 7px var(--gold); }
  .menubar .clk{ font-family:var(--mono); font-size:12px; color:var(--pale); } .menubar .clk small{ color:var(--slate); font-size:9px; margin-right:4px; letter-spacing:.15em; }

  /* ── ticker banner ────────────────── */
  .ticker{ position:fixed; top:30px; left:0; right:0; height:30px; z-index:8900; overflow:hidden;
    background:rgba(20,19,16,.9); border-bottom:1px solid var(--line); display:flex; align-items:center; }
  .ticktrack{ display:inline-flex; gap:30px; white-space:nowrap; padding-left:100%; animation:scroll 60s linear infinite; }
  @keyframes scroll{ to{ transform:translateX(-100%);} }
  .tk-item{ font-size:12px; display:inline-flex; align-items:center; gap:7px; }
  .tk-item .s{ font:700 12px var(--display); color:var(--pale); letter-spacing:.03em; }
  .tk-item .p{ font-family:var(--mono); color:var(--bone); font-size:11.5px; }
  .tk-item .d{ font-family:var(--mono); font-size:11px; } .tk-item .d.up{ color:var(--gold);} .tk-item .d.dn{ color:var(--loss);} .tk-item .d.nv{ color:var(--slate); font-style:italic;}
  .tk-sep{ color:var(--edge); }

  /* ── desktop ──────────────────────── */
  .desktop{ position:fixed; top:60px; left:0; right:0; bottom:0; overflow:hidden; }

  /* ── window ───────────────────────── */
  .win{ position:absolute; background:var(--card); border:1px solid var(--edge); border-radius:11px;
    box-shadow:0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.4); overflow:hidden; display:flex; flex-direction:column; min-width:280px; min-height:150px; }
  .win.focus{ box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(212,175,55,.14); }
  .tbar{ height:36px; flex:none; display:flex; align-items:center; gap:9px; padding:0 12px; cursor:grab;
    background:linear-gradient(var(--surface-2),#191815); border-bottom:1px solid var(--edge); user-select:none; }
  .tbar:active{ cursor:grabbing; }
  .lights{ display:flex; gap:8px; }
  .lights b{ width:12px;height:12px;border-radius:50%; display:inline-block; cursor:pointer; position:relative; }
  .lights .c{ background:var(--loss); } .lights .m{ background:var(--gold-dim); } .lights .z{ background:var(--gold); }
  .tbar .ttl{ font:600 13px var(--display); letter-spacing:.05em; color:var(--pale); flex:1; text-align:center; padding-right:44px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tbar .eng{ font-size:8px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
  .wbody{ flex:1; overflow:auto; padding:13px 15px; }
  .wbody::-webkit-scrollbar{ width:9px; } .wbody::-webkit-scrollbar-thumb{ background:var(--edge); border-radius:6px; }

  /* ── dock ─────────────────────────── */
  .dock{ position:fixed; bottom:12px; left:50%; transform:translateX(-50%); z-index:9000; display:flex; gap:9px;
    padding:9px 12px; background:rgba(20,19,16,.72); backdrop-filter:blur(18px); border:1px solid var(--line-2); border-radius:18px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  .dockic{ width:44px;height:44px; border-radius:12px; display:grid; place-items:center; cursor:pointer; position:relative;
    background:linear-gradient(150deg,#232019,#15130f); border:1px solid var(--edge); color:var(--gold); transition:.14s; }
  .dockic:hover{ transform:translateY(-6px) scale(1.06); border-color:var(--gold-dim); }
  .dockic svg{ width:21px;height:21px; }
  .dockic .lab{ position:absolute; bottom:52px; left:50%; transform:translateX(-50%); background:var(--ink); border:1px solid var(--edge); color:var(--pale);
    font-size:11px; padding:4px 9px; border-radius:7px; white-space:nowrap; opacity:0; pointer-events:none; transition:.14s; }
  .dockic:hover .lab{ opacity:1; }
  .dockic.open::after{ content:""; position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); width:4px;height:4px;border-radius:50%; background:var(--gold); }

  /* ── content atoms ────────────────── */
  .lbl{ font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--slate); }
  .kv{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--edge); font-size:12.5px; }
  .kv:last-child{ border-bottom:none; } .kv span{ color:var(--slate); } .kv b{ font-family:var(--mono); font-weight:500; color:var(--pale); text-align:right; }
  .kv b.up{ color:var(--gold);} .kv b.dn{ color:var(--loss);}
  .note{ font-family:var(--display); font-style:italic; font-size:12.5px; color:var(--slate); line-height:1.55; margin-top:9px; }
  table{ width:100%; border-collapse:collapse; } th{ font-size:8px; letter-spacing:.15em; text-transform:uppercase; color:var(--slate); text-align:left; padding:6px 7px; border-bottom:1px solid var(--edge); } th.r,td.r{text-align:right}
  td{ padding:7px; font-size:11.5px; border-bottom:1px dashed var(--edge); } tr:last-child td{border-bottom:none} tbody tr:hover{ background:rgba(245,236,203,.02);}
  .id{ font-family:var(--mono); font-size:10px; color:var(--gold-dim);} .tk2{ font:700 13px var(--display); color:var(--pale);}
  .grade{ font:700 13px var(--display);} .g-a{color:var(--gold)}.g-b{color:var(--pale)}.g-c{color:var(--bone)}.g-d{color:var(--slate)}
  .chip{ font:700 8.5px var(--ui); letter-spacing:.1em; padding:3px 7px; border-radius:5px; white-space:nowrap; text-transform:uppercase; display:inline-block;}
  .chip.gate{ color:var(--ink); background:var(--gold);} .chip.watch{ color:var(--gold); border:1px solid var(--gold-dim);} .chip.no{ color:var(--slate); border:1px solid var(--edge);} .chip.loss{ color:#fff; background:var(--loss);}
  .seal-lg{ width:54px;height:54px;border-radius:50%;border:2px solid var(--gold); display:grid;place-items:center; font:700 22px var(--display); color:var(--gold); transform:rotate(-8deg); box-shadow:inset 0 0 0 3px var(--ink);}
  .seal-lg.red{ border-color:var(--loss); color:var(--loss);}
  .gchips{ display:flex; gap:6px; } .gc{ flex:1; text-align:center; background:var(--ink); border:1px solid var(--edge); border-radius:7px; padding:6px 0 5px;}
  .gc .l{ font-size:8px; letter-spacing:.14em; color:var(--slate); text-transform:uppercase;} .gc .v{ font:700 15px var(--display); }
  .sbar{ height:5px; background:var(--edge); border-radius:3px; overflow:hidden; margin-top:6px;} .sbar i{ display:block;height:100%; background:linear-gradient(90deg,var(--gold-dim),var(--gold));}
  .cd{ font-family:var(--mono); font-weight:700; color:var(--gold);} .cd.soon{ color:var(--loss);}
  .lens2{ display:grid; grid-template-columns:1fr 1fr; gap:12px;} @media(max-width:520px){.lens2{grid-template-columns:1fr}}
  .bar-h{ height:7px; border-radius:4px; background:var(--edge); overflow:hidden;} .bar-h i{ display:block;height:100%; background:var(--gold);}

  /* run console */
  .rc-seg{ display:flex; gap:5px; margin:4px 0 2px; }
  .rc-seg button{ flex:1; font:600 10px var(--ui); letter-spacing:.02em; padding:6px 3px; border-radius:7px; background:var(--ink); border:1px solid var(--edge); color:var(--slate); cursor:pointer; }
  .rc-seg button.on{ color:var(--ink); background:var(--gold); border-color:var(--gold); }
  .rc-in{ display:flex; gap:7px; margin-top:11px; }
  .rc-in input{ flex:1; background:var(--ink); border:1px solid var(--line-2); border-radius:9px; padding:9px 11px; color:var(--pale); font-family:var(--mono); font-size:12px; outline:none; }
  .rc-in input:focus{ border-color:var(--gold-dim); }
  .rc-in button{ background:var(--gold); color:var(--ink); border:none; border-radius:9px; padding:0 16px; font-weight:700; font-size:11px; letter-spacing:.08em; cursor:pointer; }
  .rc-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .rc-chips button{ font:500 10.5px var(--mono); padding:5px 9px; border-radius:7px; background:transparent; border:1px solid var(--edge); color:var(--gold); cursor:pointer; }
  .rc-chips button:hover{ border-color:var(--gold-dim); }
  .rc-hint{ font-family:var(--display); font-style:italic; color:var(--slate); font-size:12px; margin-top:8px; }
  .rc-log{ margin-top:10px; border-top:1px solid var(--edge); padding-top:9px; font-family:var(--mono); font-size:10.5px; line-height:1.75; }
  .rc-log .ln{ display:flex; gap:8px; } .rc-log .t{ color:var(--slate); flex:none; } .rc-log .s{ color:var(--gold); flex:none; width:96px; } .rc-log .ok{ color:var(--bone); } .rc-log .warn{ color:var(--loss); }

  /* settings */
  .set-banner{ font-size:11px; line-height:1.5; color:var(--gold); background:rgba(212,175,55,.08); border:1px solid var(--gold-dim); border-radius:9px; padding:9px 11px; }
  .set-banner b{ letter-spacing:.1em; }
  .conn{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed var(--edge); }
  .conn:last-child{ border-bottom:none; }
  .conn .st{ width:8px;height:8px;border-radius:50%; flex:none; } .conn .st.on{ background:var(--gold); box-shadow:0 0 7px var(--gold); } .conn .st.off{ background:var(--edge); }
  .conn .who{ width:118px; flex:none; } .conn .nm{ font-weight:600; color:var(--pale); font-size:12.5px; } .conn .kind{ font-size:8px; letter-spacing:.12em; text-transform:uppercase; color:var(--slate); }
  .conn .mcp{ flex:1; min-width:0; background:var(--ink); border:1px solid var(--edge); border-radius:7px; padding:6px 8px; color:var(--bone); font-family:var(--mono); font-size:10px; outline:none; }
  .conn .mcp:focus{ border-color:var(--gold-dim); }
  .tgl{ width:34px;height:19px;border-radius:12px; background:var(--edge); position:relative; cursor:pointer; flex:none; transition:.15s; }
  .tgl.on{ background:var(--gold); } .tgl b{ position:absolute; top:2px; left:2px; width:15px;height:15px;border-radius:50%; background:var(--pale); transition:.15s; } .tgl.on b{ left:17px; background:var(--ink); }
  .tgl.danger.on{ background:var(--loss); }
  .exec-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px dashed var(--edge); font-size:12px; } .exec-row:last-child{ border-bottom:none; } .exec-row>span{ color:var(--slate); }
  .exec-mode{ display:flex; gap:5px; } .exec-mode button{ font:600 10px var(--ui); padding:5px 13px; border-radius:7px; background:var(--ink); border:1px solid var(--edge); color:var(--slate); cursor:pointer; } .exec-mode button.on{ color:var(--ink); background:var(--gold); border-color:var(--gold); } .exec-mode button.live.on{ background:var(--loss); border-color:var(--loss); color:#fff; }
  .set-in{ width:66px; background:var(--ink); border:1px solid var(--edge); border-radius:6px; padding:5px 7px; color:var(--pale); font-family:var(--mono); font-size:11px; text-align:right; outline:none; }
</style>
</head>

<div class="menubar">

  <div class="m">Run</div><div class="m">Board</div><div class="m">View</div><div class="m">Window</div>

const CRYPTO=new Set(["BTC","ETH","BNB","XRP","SOL","TRX","DOGE","HYPE","XLM"]);
const isOpen=r=>!r.outcome, isLive=r=>/ARMED|Setup Forming|Watchlist|Top watchlist|Hedge/i.test(r.final_call||"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtPx=v=>typeof v!=="number"?"—":v>=1000?"$"+v.toLocaleString("en-US"):v<1?"$"+v.toFixed(4):"$"+v.toFixed(2);
const gCls=g=>!g?"g-d":({A:"g-a",B:"g-b",C:"g-c"}[g[0]]||"g-d");
const callChip=fc=>!fc?'':/ARMED|Setup Forming/i.test(fc)?'<span class="chip gate">'+esc(fc)+'</span>':/Watchlist|Top watchlist|Hedge|Accumulate/i.test(fc)?'<span class="chip watch">'+esc(fc)+'</span>':'<span class="chip no">'+esc(fc)+'</span>';

/* ── ticker banner ── */
function buildTicker(){
  const items=[];
  BOOK.filter(isOpen).forEach((r,i)=>{ const d=((i*7)%13-6)/10; // deterministic pseudo-delta
    items.push('<span class="tk-item"><span class="s">'+r.ticker+'</span><span class="p">'+fmtPx(r.review_price)+'</span><span class="d '+(d>=0?'up':'dn')+'">'+(d>=0?'+':'')+d.toFixed(2)+'%</span></span>');});
  ['KOSPI','SKHY','TSMC','ASML','WTI','US10Y','DXY','VIX','GOLD'].forEach(s=>items.push('<span class="tk-item"><span class="s">'+s+'</span><span class="d nv">not observed</span></span>'));
  const html=items.join('<span class="tk-sep">·</span>');

    mkt=/^run the market/i.test(cmd), rb=/^refresh board/i.test(cmd), tk=/^run\s+([A-Za-z]{1,6})\s*$/i.exec(cmd);

async function runChain(cmd,el){
  const log=el.querySelector('.rc-log'); if(log) log.innerHTML='';
  logLine(el,'run',esc(cmd)+'  ·  '+modeStr());
  let steps=null, backend=false;
  try{
    const r=await fetchTimeout('/api/run?cmd='+encodeURIComponent(cmd)+'&mode='+encodeURIComponent(SESSION.mode),1800);
    const j=await r.json(); if(j&&Array.isArray(j.steps)){ steps=j.steps.map(s=>[s.step,s.msg,s.cls]); backend=true; }
  }catch(e){}
  logLine(el,'backend', backend?'connected · live chain':'offline — local stub', backend?'ok':'warn');
  if(!steps) steps=stubSteps(cmd);
  for(const st of steps){ await sleep(backend?120:230); logLine(el,st[0],st[1],st[2]); }
  await sleep(150); afterFor(cmd)();
}

  if(el.dataset.zoom){ const r=JSON.parse(el.dataset.zoom); Object.assign(el.style,r); delete el.dataset.zoom; }
  else{ el.dataset.zoom=JSON.stringify({left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height});
    el.style.left='10px'; el.style.top='6px'; el.style.width=(desk.clientWidth-20)+'px'; el.style.height=(desk.clientHeight-16)+'px'; }
}
function dragify(el){
  const bar=el.querySelector('.tbar'); let sx,sy,ox,oy,drag=false;
  bar.addEventListener('mousedown',e=>{ if(e.target.closest('.lights'))return; drag=true; sx=e.clientX; sy=e.clientY; ox=el.offsetLeft; oy=el.offsetTop; e.preventDefault(); });
  window.addEventListener('mousemove',e=>{ if(!drag)return; el.style.left=Math.max(0,Math.min(desk.clientWidth-60,ox+e.clientX-sx))+'px'; el.style.top=Math.max(0,Math.min(desk.clientHeight-40,oy+e.clientY-sy))+'px'; });
  window.addEventListener('mouseup',()=>drag=false);
}
function markDock(){ document.querySelectorAll('.dockic').forEach(d=>{ const id=d.dataset.id; const el=document.getElementById('win-'+id);
  d.classList.toggle('open', !!el && el.style.display!=='none'); }); }

/* dock */
const dock=document.getElementById('dock');
dock.innerHTML=Object.entries(WINDOWS).map(([id,c])=>'<div class="dockic" data-id="'+id+'"><span class="lab">'+c.title+'</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+c.icon+'</svg></div>').join('');
dock.querySelectorAll('.dockic').forEach(d=>d.addEventListener('click',()=>openWin(d.dataset.id)));

/* clocks */
function tick(){const n=new Date();document.getElementById('ct').textContent=n.toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour12:false});document.getElementById('et').textContent=n.toLocaleTimeString('en-US',{timeZone:'America/New_York',hour12:false});}
tick();setInterval(tick,1000);

/* boot */
buildTicker();
OPEN_DEFAULT.forEach(openWin);
markDock();
const _rc=document.getElementById('win-run'); if(_rc) runChain('run the market',_rc);
</script>
</body>
