# Builds the standalone Windows installer (The-Bench-Setup-x.y.z.exe).
#
# Runs when a tag like v0.1.0 is pushed (or manually from the Actions tab).
# The finished installer lands on the repo's Releases page — download, run,
# done. No Node, no commands, no browser-file-opening.

name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write # to attach the installer to the Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run dist:win -- --publish never
        env:
          # unsigned build — Windows SmartScreen will ask "Run anyway" once
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Bench-Setup
          path: dist/The-Bench-Setup-*.exe

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/The-Bench-Setup-*.exe
